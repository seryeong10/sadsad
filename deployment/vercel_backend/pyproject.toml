[project]
name = "avata-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "python-multipart==0.0.20",
  "requests==2.32.3",
  "pydantic==2.11.4",
  "pillow==11.2.1",
  "onnxruntime==1.21.1",
  "openai>=1.82.0,<4",
  "python-dotenv==1.1.0",
  "numpy==2.0.2",
  "scikit-learn==1.6.1",
  "joblib==1.4.2",
  "torch==2.6.0+cpu",
  "torchvision==0.21.0+cpu",
  "timm==0.9.16",
  "huggingface_hub>=0.20.0,<1",
  "facenet-pytorch==2.5.3",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.vercel]
entrypoint = "server:app"
